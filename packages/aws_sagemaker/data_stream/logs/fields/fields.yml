- name: aws.cloudwatch.log_group
  type: keyword
  description: CloudWatch log group the event was read from.
- name: aws.cloudwatch.log_stream
  type: keyword
  description: CloudWatch log stream the event was read from.
- name: aws_sagemaker.workload
  type: keyword
  description: SageMaker workload inferred from the log group.
- name: aws_sagemaker.endpoint.name
  type: keyword
  description: Endpoint name taken from an `/aws/sagemaker/Endpoints/{name}` log group.
- name: aws_sagemaker.variant.name
  type: keyword
  description: Production variant, the first segment of an endpoint log stream.
- name: aws_sagemaker.job.name
  type: keyword
  description: Training, processing, or transform job name, the first segment of the log stream.
- name: aws_sagemaker.instance.member
  type: keyword
  description: Training container member after the `algo-` prefix.
- name: aws_sagemaker.host
  type: keyword
  description: Processing or transform host segment of the log stream.
- name: aws_sagemaker.stream.epoch
  type: keyword
  description: Epoch suffix on a training log stream.
- name: aws_sagemaker.stream.suffix
  type: keyword
  description: Extra stream suffix such as `data-log` on a transform or endpoint stream.
