- name: aws_sagemaker.endpoint.name
  type: keyword
  description: SageMaker endpoint dimension.
- name: aws_sagemaker.variant.name
  type: keyword
  description: Production variant dimension.
- name: aws_sagemaker.host
  type: keyword
  description: Host dimension. Training hosts are `[job]/algo-[n]`.
- name: aws_sagemaker.job.name
  type: keyword
  description: Training, processing, or transform job name dimension.
- name: aws_sagemaker.pipeline.name
  type: keyword
  description: Model building pipeline name dimension.
- name: aws_sagemaker.pipeline.step.name
  type: keyword
  description: Model building pipeline step name dimension.
- name: aws_sagemaker.inference_component.name
  type: keyword
  description: Inference component name dimension.
- name: aws_sagemaker.metrics.namespace
  type: keyword
  description: CloudWatch namespace the statistic was read from.
- name: aws_sagemaker.metrics.unit
  type: keyword
  description: Unit of the copied statistics. ModelLatency and OverheadLatency are microseconds. Pipeline durations are milliseconds.
- name: aws_sagemaker.metrics.invocations
  type: long
  metric_type: counter
  description: Number of InvokeEndpoint requests.
- name: aws_sagemaker.metrics.invocation_4xx_errors
  type: long
  metric_type: counter
  description: Number of InvokeEndpoint requests that returned a 4xx status.
- name: aws_sagemaker.metrics.invocation_5xx_errors
  type: long
  metric_type: counter
  description: Number of InvokeEndpoint requests that returned a 5xx status.
- name: aws_sagemaker.metrics.invocation_model_errors
  type: long
  metric_type: counter
  description: Number of model invocation errors.
- name: aws_sagemaker.metrics.model_latency
  type: double
  metric_type: gauge
  unit: micros
  description: Average model latency in microseconds.
- name: aws_sagemaker.metrics.overhead_latency
  type: double
  metric_type: gauge
  unit: micros
  description: Average overhead latency in microseconds.
- name: aws_sagemaker.metrics.cpu_utilization
  type: double
  metric_type: gauge
  unit: percent
  description: Average CPU utilization. Values can exceed 100 when the instance sums multiple devices.
- name: aws_sagemaker.metrics.memory_utilization
  type: double
  metric_type: gauge
  unit: percent
  description: Average memory utilization.
- name: aws_sagemaker.metrics.gpu_utilization
  type: double
  metric_type: gauge
  unit: percent
  description: Average GPU utilization. Values can exceed 100 when the instance sums multiple devices.
- name: aws_sagemaker.metrics.gpu_memory_utilization
  type: double
  metric_type: gauge
  unit: percent
  description: Average GPU memory utilization.
- name: aws_sagemaker.metrics.disk_utilization
  type: double
  metric_type: gauge
  unit: percent
  description: Average disk utilization.
- name: aws_sagemaker.metrics.cpu_utilization_normalized
  type: double
  metric_type: gauge
  unit: percent
  description: Normalized CPU utilization of an inference component.
- name: aws_sagemaker.metrics.memory_utilization_normalized
  type: double
  metric_type: gauge
  unit: percent
  description: Normalized memory utilization of an inference component.
- name: aws_sagemaker.metrics.gpu_utilization_normalized
  type: double
  metric_type: gauge
  unit: percent
  description: Normalized GPU utilization of an inference component.
- name: aws_sagemaker.metrics.gpu_memory_utilization_normalized
  type: double
  metric_type: gauge
  unit: percent
  description: Normalized GPU memory utilization of an inference component.
- name: aws_sagemaker.metrics.disk_utilization_normalized
  type: double
  metric_type: gauge
  unit: percent
  description: Normalized disk utilization of an inference component.
- name: aws_sagemaker.metrics.execution_started
  type: long
  metric_type: counter
  description: Number of pipeline executions that started.
- name: aws_sagemaker.metrics.execution_failed
  type: long
  metric_type: counter
  description: Number of pipeline executions that failed.
- name: aws_sagemaker.metrics.execution_succeeded
  type: long
  metric_type: counter
  description: Number of pipeline executions that succeeded.
- name: aws_sagemaker.metrics.execution_duration
  type: double
  metric_type: gauge
  unit: ms
  description: Average pipeline execution duration in milliseconds.
- name: aws_sagemaker.metrics.step_failed
  type: long
  metric_type: counter
  description: Number of pipeline steps that failed.
- name: aws_sagemaker.metrics.step_duration
  type: double
  metric_type: gauge
  unit: ms
  description: Average pipeline step duration in milliseconds.
