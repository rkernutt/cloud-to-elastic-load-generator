# newer versions go on top
- version: "0.1.5"
  changes:
    - description: Require Kibana 9.6 or later and ship SageMaker universal alerts plus anomaly detection modules.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/1
- version: "0.1.4"
  changes:
    - description: Tag SageMaker dashboards and alert templates with Amazon SageMaker so they show up in the dashboard tag filter.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/1
- version: "0.1.3"
  changes:
    - description: Add the required tags array to the SageMaker alerting rule templates so Kibana can install them.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/1
- version: "0.1.2"
  changes:
    - description: Add dashboards, alerting rule templates, and an ML module for SageMaker logs and CloudWatch metrics.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/1
- version: "0.1.1"
  changes:
    - description: Enable agentless collection so the same package runs on Elastic Cloud Serverless and on an agent you enroll yourself.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/1
- version: "0.1.0"
  changes:
    - description: Initial Amazon SageMaker logs and metrics package.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/1
